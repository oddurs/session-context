# The gate. Railway's "Wait for CI" reads the conclusion of a whole workflow
# run, not of individual jobs — so anything in here that waits on the
# deployment would deadlock: Railway holding the deploy for CI, CI holding for
# the deploy. Verifying production is therefore a separate workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  browser:
    # Most of this codebase does nothing under server rendering, and the
    # failures that matter — hydration mismatches, probes that never resolve —
    # are invisible to a build. This drives real browsers at the built site
    # and fails on any console error.
    #
    # Two engines, not one. Every browser-specific bug this project has had was
    # invisible in Chrome: the page rendered its markup in Firefox and then sat
    # there, never hydrating, for months. Safari is the third engine and cannot
    # run here, so check it by hand with `npm run probe:safari` before a change
    # that touches loading, storage or permissions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: browser-actions/setup-firefox@v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the server
        run: |
          NODE_ENV=production PORT=3939 node server.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3939/methods > /dev/null && break
            sleep 2
          done
      - name: Drive a real browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run probe -- http://localhost:3939/ 20000
      - name: Check the methods page too
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run probe -- http://localhost:3939/methods 8000
      - name: And the design notes
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run probe -- http://localhost:3939/design 8000
      - name: And the privacy page
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run probe -- http://localhost:3939/privacy 6000
      - name: And again in Firefox
        env:
          FIREFOX_PATH: firefox
        run: npm run probe:firefox -- http://localhost:3939/ 20000
      - name: Firefox on the methods page
        env:
          FIREFOX_PATH: firefox
        run: npm run probe:firefox -- http://localhost:3939/methods 8000
